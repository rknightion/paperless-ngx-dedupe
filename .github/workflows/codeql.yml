name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 2 * * 4'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write # uploads CodeQL results
      packages: read # permits analysis of package metadata
      actions: read # reads workflow metadata for Actions analysis
      contents: read # checks out and analyzes repository source
    uses: rknightion/.github/.github/workflows/codeql.yml@40b04a8393537f0aaf610e9286a5d4af44f98455 # v1.32.2
    with:
      languages: '[{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
