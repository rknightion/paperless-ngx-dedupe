services:
  app:
    image: ghcr.io/rknightion/paperless-ngx-dedupe:latest
    # Pin a release for controlled upgrades, for example ghcr.io/rknightion/paperless-ngx-dedupe:<version>
    security_opt: ['no-new-privileges:true']
    # The entrypoint needs these to fix data ownership and drop privileges.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    # Bound to this host only because the app has no built-in login.
    # Remove 127.0.0.1: to publish on the network, behind an authenticating proxy.
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - ./docker-data:/app/data
    env_file:
      - .env
    environment:
      # Fixed: the container always listens on 3000. PORT in .env only changes the host port above.
      PORT: 3000
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: unless-stopped
    stop_grace_period: 30s
