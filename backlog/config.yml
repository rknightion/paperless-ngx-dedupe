project_name: "Paperless NGX Dedupe"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
definition_of_done:
  - "pnpm lint && pnpm format --write && pnpm check && pnpm test"
  - "pnpm build (core then web, in dependency order)"
  - "pnpm test:e2e (only if packages/web behaviour changed)"
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "pnd"
