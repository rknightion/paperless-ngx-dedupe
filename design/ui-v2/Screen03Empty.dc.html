<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/m7kni-design-system-v2-a03561c4-ff48-4ee7-8eb6-2f2a21c7ee72/tokens/tokens.css">
<link rel="stylesheet" href="_ds/m7kni-design-system-v2-a03561c4-ff48-4ee7-8eb6-2f2a21c7ee72/styles/fonts.css">
<script src="icons.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</helmet>
<div style="width:1216px;background:var(--color-bg-canvas);color:var(--color-fg-default);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13.5px;line-height:1.45">
  <div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-surface);padding:8px 24px">
    <div style="position:relative;width:260px">
      <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;color:var(--color-fg-faint)"><svg width="14" height="14" fill="currentColor"><use href="#i-magnifying-glass"></use></svg></span>
      <input type="text" defaultValue="vehicle tax reminder" style="width:100%;height:28px;padding:0 8px 0 28px;border:1px solid var(--color-bg-accent);border-radius:3px;background:var(--color-bg-raised);color:var(--color-fg-default);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px">
    </div>
    <div role="tablist" style="display:flex;border:1px solid var(--color-border-default);border-radius:3px;overflow:hidden">
      <button type="button" role="tab" aria-selected="false" style="height:26px;padding:0 12px;border:0;background:transparent;color:var(--color-fg-soft);font-family:inherit;font-size:12.5px;cursor:pointer">All</button>
      <button type="button" role="tab" aria-selected="true" style="height:26px;padding:0 12px;border:0;border-left:1px solid var(--color-border-default);background:var(--color-bg-selected);color:var(--color-fg-default);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer">In duplicates</button>
      <button type="button" role="tab" aria-selected="false" style="height:26px;padding:0 12px;border:0;border-left:1px solid var(--color-border-default);background:transparent;color:var(--color-fg-soft);font-family:inherit;font-size:12.5px;cursor:pointer">AI pending</button>
      <button type="button" role="tab" aria-selected="false" style="height:26px;padding:0 12px;border:0;border-left:1px solid var(--color-border-default);background:transparent;color:var(--color-fg-soft);font-family:inherit;font-size:12.5px;cursor:pointer">Unclassified</button>
      <button type="button" role="tab" aria-selected="false" style="height:26px;padding:0 12px;border:0;border-left:1px solid var(--color-border-default);background:transparent;color:var(--color-fg-soft);font-family:inherit;font-size:12.5px;cursor:pointer">Issues</button>
    </div>
    <span style="margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-variant-numeric:tabular-nums;color:var(--color-fg-muted)">0 documents &middot; synced 4m ago</span>
  </div>

  <div style="display:flex;border-bottom:1px solid var(--color-border-strong);background:var(--color-bg-surface)">
    <div style="width:36px;padding:6px 0 6px 24px"></div>
    <div style="flex:1;padding:6px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">Document</div>
    <div style="width:240px;padding:6px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">Classification</div>
    <div style="width:120px;padding:6px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">OCR</div>
    <div style="width:150px;padding:6px 12px;text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">Duplicate review</div>
    <div style="width:132px;padding:6px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">AI review</div>
    <div style="width:96px;padding:6px 24px 6px 12px;text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-fg-muted)">Added</div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 24px;text-align:center">
    <p style="margin:0;max-width:420px;font-size:13.5px;color:var(--color-fg-muted);text-wrap:pretty">No documents match your filters. Clear the search or widen the segment to see more.</p>
    <button type="button" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--color-border-strong);border-radius:3px;background:var(--color-bg-raised);color:var(--color-fg-default);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer" style-hover="background:var(--color-bg-hover)">Clear filters</button>
  </div>
</div>

</x-dc>
</body>
</html>
